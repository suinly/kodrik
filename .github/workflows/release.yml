name: Release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    uses: ./.github/workflows/windows.yml
  release:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Update Homebrew
        run: brew update
      - name: Build and test
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          npm ci --prefix web
          npm run build --prefix web
          cargo test --locked -- --test-threads=2
          sh scripts/test-install-macos.sh
          brew ruby scripts/test-homebrew.rb
          cargo build --release --locked --target aarch64-apple-darwin
      - name: Package and generate formula
        run: |
          binary=target/aarch64-apple-darwin/release/kodrik
          version=$("$binary" --version)
          version=${version#kodrik }
          test "$TAG" = "v$version"
          test "$(lipo -archs "$binary")" = arm64
          otool -L "$binary" | awk 'NR > 1 && $1 !~ /^\/usr\/lib\// && $1 !~ /^\/System\/Library\// { print "Non-system dependency: " $1; bad=1 } END { exit bad }'
          codesign --force --sign - --identifier com.kodrik.gateway --timestamp=none "$binary"
          codesign --verify --strict "$binary"
          mkdir dist
          archive="kodrik-$version-aarch64-apple-darwin.tar.gz"
          tar -czf "dist/$archive" -C "$(dirname "$binary")" kodrik -C "$GITHUB_WORKSPACE" LICENSE
          ruby scripts/homebrew-formula.rb "$TAG" "dist/$archive" > dist/kodrik.rb
          (cd dist && shasum -a 256 "$archive" > SHA256SUMS)
      - name: Test package installation
        run: |
          brew tap-new --no-git kodrik/local
          tap=$(brew --repository kodrik/local)
          cp dist/kodrik.rb "$tap/Formula/kodrik.rb"
          brew style --formula "$tap/Formula/kodrik.rb"
          ruby -e 'text = File.read("dist/kodrik.rb"); text.sub!(/^  url .+$/, "  url #{("file://" + Dir.glob("#{Dir.pwd}/dist/*.tar.gz").fetch(0)).inspect}"); File.write(ARGV.fetch(0), text)' "$tap/Formula/kodrik.rb"
          brew install kodrik/local/kodrik
          brew test kodrik/local/kodrik
          codesign --verify --strict "$(brew --prefix kodrik/local/kodrik)/bin/kodrik"
          brew uninstall kodrik/local/kodrik
          brew untap kodrik/local
      - name: Upload macOS package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kodrik-macos-arm64
          path: dist/*
          if-no-files-found: error
  publish:
    needs: [release, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: packages
          pattern: kodrik-*
      - name: Verify and collect packages
        run: |
          set -eu
          mkdir dist
          for package in packages/*; do
            (cd "$package" && sha256sum --check SHA256SUMS)
            find "$package" -maxdepth 1 -type f ! -name SHA256SUMS -exec cp {} dist/ \;
          done
          test -f "dist/kodrik-${TAG#v}-aarch64-apple-darwin.tar.gz"
          test -f "dist/kodrik-${TAG#v}-x86_64-pc-windows-msvc.zip"
          test -f "dist/kodrik-${TAG#v}-aarch64-pc-windows-msvc.zip"
          test -f dist/kodrik.rb
          (cd dist && sha256sum -- *.tar.gz *.zip > SHA256SUMS)
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS dist/kodrik.rb --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft --title "Kodrik $TAG" --generate-notes
