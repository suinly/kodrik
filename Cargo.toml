[package]
name = "kodrik"
version = "0.3.8"
edition = "2024"
license = "MIT"
repository = "https://github.com/suinly/kodrik"

[dependencies]
anyhow = "1.0.104"
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", features = ["multipart", "ws"] }
async-openai = { version = "0.42.1", features = ["responses", "byot", "middleware"] }
async-trait = "0.1.92"
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4.6.7", features = ["derive"] }
cookie = "0.18"
crossterm = { version = "0.29.0", features = ["event-stream"] }
env_logger = "0.11.11"
futures = "0.3.34"
include_dir = "0.7.4"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
libc = "0.2"
log = { version = "0.4.34", features = ["std", "serde"] }
mime_guess = "2"
pulldown-cmark = { version = "0.13.4", default-features = false }
reqwest = { version = "0.13.5", features = ["json", "query", "stream"] }
ratatui = { version = "0.30.2", features = ["scrolling-regions", "unstable-rendered-line-info"] }
rpassword = "7"
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
teloxide = "0.17.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
tower = { version = "0.5", features = ["util"] }
toml = "1.1.6"
tui-markdown = "0.3.10"
uuid = { version = "1", features = ["v4", "serde"] }
yaml-rust = "0.4.5"
bashkit = { version = "=0.18.2", default-features = false, features = ["jq"] }
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
rmcp = { version = "3.7.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }
web-push-native = "0.5.0"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }
tokio-rustls = "0.26"
