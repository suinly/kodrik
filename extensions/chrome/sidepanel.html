<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="Кодрик">Кодрик</title><link rel="stylesheet" href="sidepanel.css"></head>
<body>
  <div id="connection-toolbar" class="connection-toolbar" hidden><button id="settings" type="button" data-i18n="Настройки подключения">Настройки подключения</button></div>
  <dialog id="connection" aria-labelledby="connection-title">
    <div class="dialog-heading"><h1 id="connection-title" data-i18n="Настройки подключения">Настройки подключения</h1><button id="close-connection" type="button" aria-label="Закрыть настройки" data-i18n-aria-label="Закрыть настройки">×</button></div>
    <form id="connect">
    <div class="form-heading"><span data-i18n="Ваш Кодрик">Ваш Кодрик</span> <span data-i18n="Общая история, отдельный чат для вкладки">Общая история, отдельный чат для вкладки</span></div>
    <label for="server" data-i18n="Адрес сервера">Адрес сервера</label>
    <input id="server" type="url" required placeholder="https://kodrik.example.com/" autocomplete="url">
    <div class="form-actions"><button type="submit" class="primary" data-i18n="Подключить">Подключить</button><button type="button" id="login" data-i18n="Войти ↗">Войти ↗</button></div>
    <p data-i18n="Вход откроется в обычной вкладке браузера.">Вход откроется в обычной вкладке браузера.</p>
    </form>
  </dialog>
  <div id="notice"><p id="status" role="status"></p><button id="access" hidden data-i18n="Разрешить чтение сайтов">Разрешить чтение сайтов</button></div>
  <iframe id="chat" title="Чат Кодрика" data-i18n-title="Чат Кодрика" hidden allow="clipboard-write"></iframe>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
